<script>/* Motor de calculo das comissoes (puro, sem interface). Roda no navegador e no Node. */
(function (root) {
  'use strict';
  const r2 = x => { const s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; };
  const normTip = t => String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
const isNum = x => typeof x === 'number' && isFinite(x);

  function Engine(S) {
    const cache = new Map();
    const corrByNome = {}, corrByPad = {};
    S.corr.forEach(c => { corrByNome[c.nome] = c; if (c.nome_padrao) corrByPad[c.nome_padrao] = c; });
    const cfg = S.cfg;

    const benefOf = v => {
      if (v.imobiliaria && v.imobiliaria.trim()) return v.imobiliaria.trim();
      const c = corrByNome[v.corretor];
      return (c && c.nome_padrao) || v.corretor || '';
    };
    const tipoOf = b => { const c = corrByPad[b] || corrByNome[b]; return (c && c.tipo) || 'A CADASTRAR'; };
    const exigeImob = v => { const c = corrByNome[v.corretor] || corrByPad[v.corretor]; return !!(c && c.exige); };

    // vendas ativas por competencia, com beneficiario
    const byComp = {};
    S.vendas.forEach(v => {
      if (v.sit === 'Cancelado') return;
      (byComp[v.comp] = byComp[v.comp] || []).push({ v, b: benefOf(v) });
    });
    const rulesByComp = {};
    S.premios.slice().sort((a, b) => a.id - b.id).forEach(p => { (rulesByComp[p.comp] = rulesByComp[p.comp] || []).push(p); });

    function paramMatch(v) {
      const parc = Number(v.parcelamento) || 0;
      return S.params.filter(p => p.comp === v.comp && p.emp === v.emp && parc >= (p.de == null ? 0 : p.de) && parc <= (p.ate == null ? 999999 : p.ate));
    }

    function live(v) {
      const cancel = v.sit === 'Cancelado';
      const benef = benefOf(v);
      const tipo = tipoOf(benef);
      const Pm = paramMatch(v);
      const Pc = Pm.filter(p => p.pct != null);
      const one = Pc.length === 1;
      const reg = v.cr ? v.cr : (S.regs.has(v.pv) ? 'Sim' : 'Não');
      const pct = isNum(v.s_pct) ? v.s_pct : (one ? Pc[0].pct : 'VERIFICAR');
      const com = isNum(pct) ? r2(v.j * pct) : 0;
      let atoPct;
      if (isNum(v.s_ato)) atoPct = v.s_ato;
      else if (tipo === 'Imobiliária') atoPct = cfg.imob;
      else {
        const Pf = Pc.filter(p => p.fase);
        atoPct = Pf.length === 1 ? (Pf[0].fase === 'Lançamento' ? cfg.lanc : cfg.est) : 'VERIFICAR';
      }
      const ato = isNum(atoPct) ? r2(com * atoPct) : 0;
      const ret = r2(com - ato);
      let pctnr;
      if (reg === 'Não') pctnr = one ? (Pc[0].pctnr == null ? 0 : Pc[0].pctnr) : 'VERIFICAR';
      else pctnr = 1;
      const agora = cancel ? 0 : (reg === 'Não' ? (isNum(pctnr) ? r2(ato * pctnr) : 0) : ato);
      const pend = cancel ? 0 : r2(ato - agora);

      // premiacao
      let prem = 0;
      if (isNum(v.s_prem)) prem = v.s_prem;
      else if (!cancel) {
        const rules = (rulesByComp[v.comp] || []).slice(0, 3);
        const pool = byComp[v.comp] || [];
        for (const ru of rules) {
          if (ru.emp && ru.emp !== v.emp) continue;
          if (ru.tip && normTip(ru.tip) !== normTip(v.tip)) continue;
          const n = pool.filter(x =>
            (ru.tip ? normTip(x.v.tip) === normTip(ru.tip) : true) &&
            (ru.escopo === 'Corretor' ? x.b === benef : true) &&
            (ru.emp ? x.v.emp === ru.emp : (ru.escopo === 'Empreendimento' ? x.v.emp === v.emp : true))
          ).length;
          if (n >= (ru.meta || 0)) prem += ru.tipo === '% do VV Original' ? r2(v.j * ru.valor) : (ru.valor || 0);
        }
        prem = r2(prem);
      }

      // coordenador e diretor (pendencia por contrato nao registrado)
      const md = S.modos[v.comp];
      let coordP = 0, dirP = 0;
      if (!cancel && md && md.modo === 'Por contrato registrado' && reg === 'Não') {
        coordP = r2(v.j * md.pc * (1 - (md.pctnr || 0)));
        dirP = r2(v.j * md.pd * (1 - (md.pctnr || 0)));
      }

      let alerta = '';
      if (exigeImob(v) && !(v.imobiliaria && v.imobiliaria.trim())) alerta = 'Informar imobiliária';
      else if (tipo === 'A CADASTRAR') alerta = 'Cadastrar tipo do beneficiário';
      else if (pct === 'VERIFICAR' || atoPct === 'VERIFICAR' || pctnr === 'VERIFICAR') alerta = 'Parâmetro ausente ou duplicado';
      else if (reg === 'Não' && !cancel) alerta = 'Contrato não registrado';

      return { benef, tipo, reg, pct, com, atoPct, ato, ret, pctnr, agora, pend, prem, coordP, dirP, alerta };
    }

    function calc(v) {
      let r = cache.get(v.id);
      if (!r) {
        r = (v.fechado && v.origem !== 'Histórico') ? Object.assign({ frozen: true }, v.fechado) : live(v);
        cache.set(v.id, r);
      }
      return r;
    }

    function build(M) {
      const closed = !!S.fech[M];
      const rows = S.vendas.filter(v => v.comp === M).map(v => ({ v, c: calc(v) }));
      const carry = S.vendas.filter(v =>
        v.fechado_em && v.origem !== 'Histórico' && v.comp < M && v.sit !== 'Cancelado' && S.regs.has(v.pv) &&
        (v.pag_em === M || (!closed && !v.pag_em))
      ).map(v => ({ v, c: calc(v) })).filter(x => x.c.pend > 0 || x.c.coordP > 0 || x.c.dirP > 0);

      const by = new Map();
      const get = (b, t) => { if (!by.has(b)) by.set(b, { benef: b, tipo: t, n: 0, vv: 0, com: 0, ato: 0, ret: 0, agora: 0, pend: 0, pendReg: 0, prem: 0, total: 0, rows: [], carry: [] }); return by.get(b); };
      const tot = { n: 0, vv: 0, com: 0, ato: 0, ret: 0, agora: 0, pend: 0, pendReg: 0, prem: 0, total: 0, vvAtivo: 0, alertas: {} };
      rows.forEach(x => {
        const g = get(x.c.benef, x.c.tipo);
        g.rows.push(x);
        if (x.v.sit === 'Cancelado') return;
        g.n++; g.vv += x.v.j; g.com += x.c.com; g.ato += x.c.ato; g.ret += x.c.ret; g.agora += x.c.agora; g.pend += x.c.pend; g.prem += x.c.prem;
        tot.n++; tot.vv += x.v.j; tot.com += x.c.com; tot.ato += x.c.ato; tot.ret += x.c.ret; tot.agora += x.c.agora; tot.pend += x.c.pend; tot.prem += x.c.prem;
        if (x.c.alerta) tot.alertas[x.c.alerta] = (tot.alertas[x.c.alerta] || 0) + 1;
      });
      carry.forEach(x => {
        const g = get(x.c.benef, x.c.tipo);
        g.carry.push(x); g.pendReg += x.c.pend; tot.pendReg += x.c.pend;
      });
      by.forEach(g => { ['vv', 'com', 'ato', 'ret', 'agora', 'pend', 'pendReg', 'prem'].forEach(k => g[k] = r2(g[k])); g.total = r2(g.agora + g.pendReg + g.prem); });
      ['vv', 'com', 'ato', 'ret', 'agora', 'pend', 'pendReg', 'prem'].forEach(k => tot[k] = r2(tot[k]));
      tot.total = r2(tot.agora + tot.pendReg + tot.prem);

      // coordenador e diretor
      const md = S.modos[M] || { modo: '100%', pctnr: 0, pc: 0.0028, pd: 0.0012 };
      const ativos = rows.filter(x => x.v.sit !== 'Cancelado');
      const vvA = ativos.reduce((a, x) => a + x.v.j, 0);
      const mk = (pct, key) => {
        const devido = r2(vvA * pct);
        const pend = r2(ativos.reduce((a, x) => a + x[key], 0));
        const pendReg = r2(carry.reduce((a, x) => a + (x.c[key === 'cp' ? 'coordP' : 'dirP'] || 0), 0));
        return { pct, devido, pend, agora: r2(devido - pend), pendReg, total: r2(devido - pend + pendReg) };
      };
      ativos.forEach(x => { x.cp = x.c.coordP; x.dp = x.c.dirP; });
      const coord = mk(md.pc, 'cp'); const dir = mk(md.pd, 'dp');
      coord.nome = S.cfgNomes.coord; dir.nome = S.cfgNomes.dir;
      return { comp: M, closed, rows, carry, by, tot, coord, dir, modo: md, vvAtivo: r2(vvA) };
    }

    function freeze(v) { const c = calc(v); const o = Object.assign({}, c); delete o.frozen; return o; }

    return { calc, build, benefOf, tipoOf, freeze, r2 };
  }

  const api = { Engine, r2, isNum };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Calc = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>'use strict';
/* Apuracao de Comissoes Emais (modulo do Portal). Dados na tabela comissoes_docs do Supabase do Portal, so administrador. */
let db = null;
const S = {
  tab: 'painel', comp: null, busy: '', flash: null, modal: null,
  vendas: [], params: [], premios: [], corr: [], depara: [], regs: new Set(), regsInfo: [], modos: {}, fech: {}, fechInfo: {}, fechDocs: {}, vch: {}, rch: 0, can: true, owner: false, dbEmpty: false,
  cfg: { lanc: 0.8, est: 0.5, imob: 0.5 }, cfgNomes: { coord: 'JOSÉ EDUARDO CORTEZ', dir: 'CALIXTO NETO' },
  pasteV: '', pasteR: '', prevV: null, prevR: null,
  baseFilter: { comp: 'sel', q: '', soPend: false, lim: 150 }, grupo: 'interno', verKey: null, loaded: false, loadErr: null
};
let ENG = null;

/* ---------- utilidades ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => (n == null || isNaN(n)) ? '' : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = n => (n == null || isNaN(n)) ? '' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pc = (x, d = 2) => (typeof x === 'number') ? (x * 100).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: d }) + '%' : (x || '');
const L = v => v === null || v === undefined || v === '' ? 'null' : typeof v === 'number' ? (isFinite(v) ? String(v) : 'null') : typeof v === 'boolean' ? String(v) : "'" + String(v).replace(/'/g, "''") + "'";
const compLabel = c => c ? c.slice(5, 7) + '/' + c.slice(0, 4) : '';
const addMonth = (c, n) => { const d = new Date(Date.UTC(+c.slice(0, 4), +c.slice(5, 7) - 1 + n, 1)); return d.toISOString().slice(0, 10); };
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').toLowerCase().slice(0, 50);
const r2 = Calc.r2;

function parseNum(s) {
  if (s == null) return null;
  let t = String(s).replace(/R\$|\s/g, '');
  if (t === '') return null;
  if (t.includes(',') && t.includes('.')) t = t.replace(/\./g, '').replace(',', '.');
  else if (t.includes(',')) t = t.replace(',', '.');
  const n = Number(t); return isFinite(n) ? n : null;
}
function parseDate(s) {
  if (s == null) return null;
  const t = String(s).replace(/\s+/g, ' ').trim(); if (!t) return null;
  let m = t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  m = t.match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  if (/^\d{5}$/.test(t)) { const d = new Date(Date.UTC(1899, 11, 30) + Number(t) * 86400000); return d.toISOString().slice(0, 10); }
  return null;
}
function parseTSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"' && cur === '') q = true;
    else if (ch === '\t') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch === '\r') { /* ignora */ }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

/* ---------- armazenamento: banco do proprio artefato (db) ---------- */
const VCH = 80, RCH = 1500, ACH = 100;
let seq = 0;
const nid = () => Date.now() * 1000 + (seq++ % 1000);
const clone = o => JSON.parse(JSON.stringify(o));
let wq = Promise.resolve();
function dwrite(fn) { const p = wq.then(async () => { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return await fn(); } throw e; } }); wq = p.catch(() => { }); return p; }
const dset = (path, data) => dwrite(() => db.doc(path).set(clone(data)));
const ddel = path => dwrite(() => db.doc(path).delete());
const sortId = (a, b) => a.id - b.id;

function errMsg(e) {
  const c = e && e.code;
  if (c === 'readonly') return 'Seu acesso é só de leitura.';
  if (c === 'invalid_argument') return 'O banco recusou a gravação (permissão insuficiente ou dado inválido). Se você só consulta, é esperado.';
  if (c === 'quota_exceeded') return 'O banco do artefato atingiu um limite de tamanho. Baixe o backup e avise o responsável.';
  if (c === 'resource_exhausted') return 'Muitas operações seguidas. Aguarde alguns segundos e tente de novo.';
  if (c === 'unavailable') return 'O banco não respondeu. Recarregue os dados antes de repetir, para não duplicar nada.';
  if (c === 'revoked') return 'Seu acesso a este artefato foi alterado. Recarregue a página.';
  if (e && e.supa) return 'O banco recusou a operação: ' + esc(e.message || '') + (e.code === '42501' ? ' (acesso restrito a administradores)' : '');
  return 'Erro: ' + ((e && e.message) || e);
}
async function guard(label, fn) {

  catch (e) { S.busy = ''; paintBusy(); S.flash = { t: 'err', m: errMsg(e) }; render(); return undefined; }
}

async function loadAll() {
  const docs = async c => (await db.collection(c).get()).docs.map(d => ({ id: d.id, ...clone(d.data()) }));
  const cfgD = await db.doc('cfg/main').get();
  if (!cfgD.exists) { S.dbEmpty = true; return false; }
  S.dbEmpty = false;
  const c = clone(cfgD.data());
  S.cfg = c.cfg; S.cfgNomes = c.nomes;
  const one = async (p, k, d) => { const x = await db.doc(p).get(); return x.exists ? clone(x.data())[k] : d; };
  S.corr = await one('corr/all', 'list', []); S.depara = await one('depara/all', 'list', []);
  S.params = await one('params/all', 'list', []); S.premios = await one('premios/all', 'list', []);
  S.modos = await one('modos/all', 'map', {});
  const rg = (await docs('regs')).sort((a, b) => a.i - b.i); S.rch = rg.length; S.regsInfo = rg.flatMap(x => x.list);
  const vd = await docs('vendas'); S.vch = {}; S.vendas = [];
  vd.forEach(d => { S.vch[d.comp] = Math.max(S.vch[d.comp] || 0, d.k + 1); S.vendas.push(...d.list); });
  S.vendas.sort(sortId);
  const fd = await docs('fech'); S.fech = {}; S.fechInfo = {}; S.fechDocs = {};
  fd.forEach(d => { S.fechDocs[d.comp] = d; if (!d.aberto) { S.fech[d.comp] = true; S.fechInfo[d.comp] = { comp: d.comp, fe: d.fe, obs: d.obs }; } });
  return true;
}
function rebuild() {
  S.regs = new Set(S.regsInfo.map(x => String(x.pv)));
  ENG = Calc.Engine(S);
  if (!S.comp) { const fc = Object.keys(S.fech).sort(); S.comp = fc.length ? addMonth(fc[fc.length - 1], 1) : '2026-11-01'; }
}

const SAVERS = {
  cfg: () => dset('cfg/main', { cfg: S.cfg, nomes: S.cfgNomes }),
  corr: () => dset('corr/all', { list: S.corr }),

};
async function saveVendas(comp) {

async function mut(label, fn, keys) {

function snapshot(M, md) {
  const b = ENG.build(M);

  const fz = v => { try { return ENG.freeze(v); } catch (e) { return ENG.calc(v); } };
  const rows = b.rows.map(x => ({ v: slim(x.v), c: fz(x.v) }));
  const mapB = x => ({ benef: x.benef, tipo: x.tipo, n: x.n, vv: x.vv, com: x.com, ato: x.ato, agora: x.agora, pend: x.pend, pendReg: x.pendReg, prem: x.prem, total: x.total });
  const mapC = x => ({ nome: x.nome, pct: x.pct, devido: x.devido, pend: x.pend, agora: x.agora, pendReg: x.pendReg, total: x.total });
  const resumo = {
    tot: clone(b.tot), modo: clone(md || b.modo), vvAtivo: b.vvAtivo,
    by: [...b.by.values()].map(mapB), coord: mapC(b.coord), dir: mapC(b.dir),
    carry: b.carry.map(x => ({ pv: x.v.pv, comp: x.v.comp, benef: x.c.benef, pend: x.c.pend, coordP: x.c.coordP || 0, dirP: x.c.dirP || 0 })),
    params: clone(S.params.filter(p => p.comp === M)), premios: clone(S.premios.filter(p => p.comp === M)), cfg: clone(S.cfg)
  };
  return { rows, resumo, b };
}
async function gravarArquivo(M, ver, rows) {
  const n = Math.ceil(rows.length / ACH);
  for (let k = 0; k < n; k++) await dset(`arquivo/${M}_v${ver}_${k}`, { comp: M, ver, k, rows: rows.slice(k * ACH, (k + 1) * ACH) });

function analisarVendas() {
  const data = parseTSV(S.pasteV);
  const items = [], seen = new Set();
  const ativos = new Map(); S.vendas.filter(v => v.sit !== 'Cancelado').forEach(v => { if (!ativos.has(v.pv)) ativos.set(v.pv, v); });
  const corrKnown = new Set(S.corr.map(c => c.nome));
  let ign = 0;
  data.forEach(r => {
    const pv = String(r[3] || '').trim();
    if (!/^\d+$/.test(pv)) { ign++; return; }
    const it = { pv, emp: empCanon(String(r[0] || '').trim()), bl: String(r[1] || '').trim(), ap: String(r[2] || '').trim(), dt_pv: parseDate(r[4]), status: String(r[5] || '').trim(), cliente: String(r[6] || '').replace(/\s+/g, ' ').trim(), j: parseNum(r[7]), vv: parseNum(r[8]), vp: parseNum(r[9]), dt_ef: parseDate(r[10]), corretor: String(r[11] || '').replace(/\s+/g, ' ').trim(), parc: String(r[12] || '').trim(), tip: String(r[13] || '').replace(/\s+/g, ' ').trim(), flags: [] };
    const ex = ativos.get(pv);
    if (ex) it.flags.push(`PV já ativo em ${compLabel(ex.comp)}. Confirma duplicidade ou pagamento de saldo?`);
    if (seen.has(pv)) it.flags.push('PV repetido neste arquivo');
    seen.add(pv);
    if (it.status !== 'F') it.flags.push(`Status PV "${it.status || 'vazio'}" (esperado F)`);
    if (!it.j || it.j <= 0) it.flags.push('VV Original vazio ou zero');
    if (!it.corretor) it.flags.push('Sem corretor');
    it.sel = !it.flags.length; items.push(it);
  });
  const novosCorr = [...new Set(items.map(i => i.corretor).filter(c => c && !corrKnown.has(c)))];
  const empsComParam = new Set(S.params.filter(p => p.comp === S.comp).map(p => p.emp));
  const semParam = [...new Set(items.map(i => i.emp).filter(e => e && !empsComParam.has(e)))];
  S.prevV = { items, novosCorr, semParam };
  S.flash = items.length ? { t: 'ok', m: `${items.length} linha(s) lidas${ign ? `, ${ign} ignorada(s) (título ou linha sem PV)` : ''}. Confira os avisos antes de gravar.` } : { t: 'err', m: 'Não encontrei linhas com PV numérico. Confira se colou as colunas A a N.' };
}

function analisarRegs() {
  const data = parseTSV(S.pasteR); const novos = [], ja = [];
  const seen = new Set();
  data.forEach(r => {
    let pv = null, dt = null;
    for (const c of r) { const t = String(c).trim(); if (pv === null && /^\d{4,9}$/.test(t)) pv = t; if (dt === null && /\d{1,2}\/\d{1,2}\/\d{4}|\d{4}-\d{2}-\d{2}/.test(t)) dt = parseDate(t); }
    if (!pv || seen.has(pv)) return; seen.add(pv);
    (S.regs.has(pv) ? ja : novos).push({ pv, dt });
  });
  const novoSet = new Set(novos.map(x => x.pv));
  const todos = new Set([...S.regs, ...novoSet]);
  const semVenda = novos.filter(x => !S.vendas.some(v => v.pv === x.pv)).map(x => x.pv);
  // vendas fechadas com saldo que passam a estar regularizadas
  const regulariza = S.vendas.filter(v => novoSet.has(v.pv) && v.fechado_em && v.origem !== 'Histórico' && v.sit !== 'Cancelado' && !v.pag_em)
    .map(v => { const c = ENG.calc(v); return { pv: v.pv, comp: v.comp, benef: c.benef, pend: c.pend }; }).filter(x => x.pend > 0);
  const abertas = S.vendas.filter(v => novoSet.has(v.pv) && !v.fechado_em).length;
  S.prevR = { novos, ja, semVenda, regulariza, abertas };
  S.flash = { t: 'ok', m: `${seen.size} PV(s) lidos. ${novos.length} novos; ${abertas} venda(s) de meses abertos passam a constar como registradas.` };
}
async function gravarRegs() {
  const pr = S.prevR; if (!pr || !pr.novos.length) return;
  const ok = await mut('Gravando registros…', () => {
    const hoje = new Date().toISOString();
    pr.novos.forEach(x => { if (!S.regsInfo.some(r => String(r.pv) === x.pv)) S.regsInfo.push({ pv: x.pv, dt: x.dt, criado: hoje }); });
  }, ['regs']);
  if (ok) { S.flash = { t: 'ok', m: `${pr.novos.length} registro(s) gravados. Os saldos regularizados aparecem no mês aberto.` }; S.pasteR = ''; S.prevR = null; render(); }
}

  const cab = (titulo, sub) => `<div class="rep"><h1 style="margin:0;font-size:18px">Emais Urbanismo · Demonstrativo de comissões</h1><div style="color:#555;margin:4px 0 10px">Competência ${compLabel(b.comp)} · ${esc(titulo)}${sub ? ' · ' + esc(sub) : ''}</div>`;

async function baixar(filename, data) {
  try {
    const type = /\.json$/.test(filename) ? 'application/json' : /\.csv$/.test(filename) ? 'text/csv;charset=utf-8' : 'text/html;charset=utf-8';
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

  } catch (e) { S.flash = { t: 'err', m: 'Não consegui baixar: ' + esc((e && e.message) || e) }; }
  render();

}
async function fecharOk() {
  const M = S.comp; S.modal = null; S.flash = null;
  const md = clone(S.modos[M] || { modo: '100%', pctnr: 0, pc: 0.0028, pd: 0.0012 });
  const ok = await mut('Fechando o mês…', async () => {
    const snap = snapshot(M, md);
    const prev = S.fechDocs[M] || {};
    const ver = (prev.ver || 0) + 1, agora = new Date().toISOString();
    const nch = await gravarArquivo(M, ver, snap.rows);
    const fzMap = new Map(snap.rows.map(r => [r.v.id, r.c]));
    S.vendas.forEach(v => { if (v.comp === M && fzMap.has(v.id)) { v.fechado = fzMap.get(v.id); v.fechado_em = agora; } });
    const carryIds = new Set(snap.b.carry.map(x => x.v.id));
    S.vendas.forEach(v => { if (carryIds.has(v.id)) v.pag_em = M; });
    S.modos[M] = md;
    S._saveComps = [...new Set([M, ...snap.b.carry.map(x => x.v.comp)])];
    const doc = { comp: M, fe: agora, obs: 'Fechado pelo Artefato', ver, aberto: false, chunks: nch, resumo: snap.resumo, historico: prev.historico || [] };
    await dset('fech/' + M, doc);
    S.fechDocs[M] = doc; S.fech[M] = true; S.fechInfo[M] = { comp: M, fe: agora, obs: doc.obs };
  }, () => ['modos', ...S._saveComps.map(c => 'vendas:' + c)]);
  if (ok) { S.flash = { t: 'ok', m: `${compLabel(M)} fechado e arquivado. Baixe o backup na aba Backup para guardar uma cópia fora do sistema.` }; S.comp = addMonth(M, 1); render(); }
}
function reabrir() {
  S.modal = `<h2 style="margin-top:0">Reabrir ${compLabel(S.comp)}?</h2><p>Os valores deixam de ser congelados e voltam a recalcular. Saldos regularizados que foram pagos neste mês voltam a ficar pendentes. Use só para corrigir erro.</p><div class="row"><button class="btn danger" data-act="reabrirOk">Reabrir</button><button class="btn" data-act="modalOff">Cancelar</button></div>`;
}
async function reabrirOk() {
  const M = S.comp; S.modal = null;
  await mut('Reabrindo…', async () => {
    const d = S.fechDocs[M]; if (!d) return;
    const agora = new Date().toISOString();
    const hist = [...(d.historico || []), { ver: d.ver || 1, fe: d.fe, reaberto_em: agora, total: d.resumo && d.resumo.tot ? d.resumo.tot.total : null, chunks: d.chunks || 0 }];
    const doc = { ...d, aberto: true, reaberto_em: agora, historico: hist };
    await dset('fech/' + M, doc);
    S.fechDocs[M] = doc; delete S.fech[M]; delete S.fechInfo[M];
    S.vendas.forEach(v => { if (v.comp === M) { v.fechado_em = null; v.fechado = null; } if (v.pag_em === M) v.pag_em = null; });
    S._saveComps = [...new Set(S.vendas.filter(v => v.comp === M).map(v => v.comp).concat([M, ...S.vendas.filter(v => v.fechado_em && v.origem !== 'Histórico').map(v => v.comp)]))];
  }, () => S._saveComps.map(c => 'vendas:' + c));
}

document.addEventListener('input', e => {

  if (k === 'pasteV') S.pasteV = e.target.value; if (k === 'pasteR') S.pasteR = e.target.value;
  if (k === 'bq') { S.baseFilter.q = e.target.value; clearTimeout(window.__bq); window.__bq = setTimeout(() => { render(); const el = document.getElementById('bq'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 350); }

document.addEventListener('change', async e => {
  const t = e.target, d = t.dataset || {}; if (!d.chg) return;
  if (d.chg === 'comp') { S.comp = t.value; S.prevV = null; S.baseFilter.lim = 150; S.verKey = null; render(); }
  else if (d.chg === 'selV') { S.prevV.items[+d.k].sel = t.checked; render(); }
  else if (d.chg === 'bf') { S.baseFilter[d.f] = d.f === 'soPend' ? t.checked : t.value; render(); }
  else if (d.chg === 'venda') {
    const v = S.vendas.find(x => x.id === +d.id); if (!v) return;
    const val = d.f === 'imobiliaria' ? t.value.trim() : t.value;
    await mut('Salvando…', () => { v[d.f] = val === '' ? null : val; }, ['vendas:' + v.comp]);
  }
  else if (d.chg === 'param') {
    let val = t.value; const f = d.f; const p = S.params.find(x => x.id === +d.id); if (!p) return;
    if (['de', 'ate'].includes(f)) val = val === '' ? null : parseInt(val, 10);
    else if (['pct', 'pctnr'].includes(f)) { const n = pNum(val); val = n == null ? null : n / 100; }
    else if (val === '') val = null;
    await mut('Salvando…', () => { p[f] = val; }, ['params']);
  }
  else if (d.chg === 'prem') {
    let val = t.value; const f = d.f; const p = S.premios.find(x => x.id === +d.id); if (!p) return;
    if (f === 'meta') val = val === '' ? null : parseInt(val, 10);
    else if (f === 'valor') { const n = pNum(val); val = n == null ? null : ((p.tipo === '% do VV Original') ? n / 100 : n); }
    else if (val === '') val = null;
    await mut('Salvando…', () => {
      if (f === 'tipo' && p.valor != null) { const novo = val === '% do VV Original' ? (p.tipo === '% do VV Original' ? p.valor : p.valor / 100) : (p.tipo === '% do VV Original' ? p.valor * 100 : p.valor); p.valor = novo; }
      p[f] = val;
    }, ['premios']);
  }
  else if (d.chg === 'corr') {
    const f = d.f; const val = f === 'exige' ? t.checked : t.value;
    const c = S.corr.find(x => x.nome === d.n); if (!c) return;
    await mut('Salvando…', () => { c[f] = f === 'exige' ? val : (val === '' ? null : val); }, ['corr']);
  }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v; if (a === 'irComp') e.preventDefault();
  const val = id => (document.getElementById(id) || {}).value;
  switch (a) {
    case 'tab': S.tab = v; S.flash = null; render(); break;
    case 'flashOff': S.flash = null; render(); break;
    case 'modalOff': S.modal = null; render(); break;
    case 'irComp': S.comp = v; render(); window.scrollTo(0, 0); break;
    case 'recarregar': await reload(); break;
    case 'restaurar': await restaurar(); break;
    case 'sair': if (window.__supa) { await window.__supa.auth.signOut(); location.href = 'index.html'; } break;
    case 'analisarVendas': analisarVendas(); render(); break;
    case 'limparVendas': S.prevV = null; S.pasteV = ''; render(); break;
    case 'gravarVendas': await gravarVendas(); break;
    case 'analisarRegs': analisarRegs(); render(); break;
    case 'limparRegs': S.prevR = null; S.pasteR = ''; render(); break;
    case 'gravarRegs': await gravarRegs(); break;
    case 'rmReg': { const pv = (val('rmPv') || '').trim(); if (!/^\d+$/.test(pv)) { S.flash = { t: 'err', m: 'Informe um PV numérico.' }; render(); break; } const ok = await mut('Removendo registro…', () => { S.regsInfo = S.regsInfo.filter(r => String(r.pv) !== pv); }, ['regs']); if (ok) { S.flash = { t: 'ok', m: 'Registro do PV ' + esc(pv) + ' removido (se existia).' }; render(); } break; }
    case 'maisBase': S.baseFilter.lim += 200; render(); break;
    case 'addParam': await mut('Adicionando…', () => { S.params.push({ id: nid(), comp: S.comp, emp: knownEmps()[0] || 'EMPREENDIMENTO', fase: null, de: 0, ate: 999, pct: null, pctnr: 0 }); }, ['params']); break;
    case 'delParam': await mut('Excluindo…', () => { S.params = S.params.filter(p => p.id !== +t.dataset.id); }, ['params']); break;
    case 'copyParam': {
      const prev = [...new Set(S.params.map(p => p.comp))].filter(c => c < S.comp).sort().pop();
      if (!prev) { S.flash = { t: 'err', m: 'Não há mês anterior com parâmetros.' }; render(); break; }
      if (S.params.some(p => p.comp === S.comp) && !window.__cp) { window.__cp = 1; S.flash = { t: 'warn', m: 'Este mês já tem parâmetros. Clique de novo em copiar se quiser acrescentar os de ' + compLabel(prev) + ' (pode duplicar).' }; render(); break; }
      window.__cp = 0;
      await mut('Copiando…', () => { S.params.filter(p => p.comp === prev).forEach(p => S.params.push({ ...p, id: nid(), comp: S.comp })); }, ['params']);
      S.flash = { t: 'ok', m: 'Parâmetros copiados de ' + compLabel(prev) + '. Revise os percentuais.' }; render(); break;
    }
    case 'addPrem': await mut('Adicionando…', () => { S.premios.push({ id: nid(), comp: S.comp, escopo: 'Corretor', emp: null, tip: null, meta: 5, tipo: 'R$ por venda', valor: 0 }); }, ['premios']); break;
    case 'delPrem': await mut('Excluindo…', () => { S.premios = S.premios.filter(p => p.id !== +t.dataset.id); }, ['premios']); break;
    case 'copyPrem': {
      const prev = [...new Set(S.premios.map(p => p.comp))].filter(c => c < S.comp).sort().pop();
      if (!prev) { S.flash = { t: 'err', m: 'Não há mês anterior com premiação.' }; render(); break; }
      await mut('Copiando…', () => { const falta = 3 - S.premios.filter(p => p.comp === S.comp).length; S.premios.filter(p => p.comp === prev).slice(0, Math.max(0, falta)).forEach(p => S.premios.push({ ...p, id: nid(), comp: S.comp })); }, ['premios']); break;
    }
    case 'saveModo': {
      const pctnr = (pNum(val('mdPct')) || 0) / 100, pcc = (pNum(val('mdPc')) ?? 0.28) / 100, pd = (pNum(val('mdPd')) ?? 0.12) / 100;
      await mut('Salvando…', () => { S.modos[S.comp] = { modo: val('mdModo'), pctnr, pc: pcc, pd }; }, ['modos']);
      S.flash = { t: 'ok', m: 'Modo do coordenador e do diretor salvo para ' + compLabel(S.comp) + '.' }; render(); break;
    }
    case 'saveCfg': {
      const g = id => (pNum(val(id)) || 0) / 100;
      await mut('Salvando…', () => { S.cfg = { lanc: g('cfgLanc'), est: g('cfgEst'), imob: g('cfgImob') }; S.cfgNomes = { coord: val('cfgCoord'), dir: val('cfgDir') }; }, ['cfg']);
      S.flash = { t: 'ok', m: 'Regras salvas.' }; render(); break;
    }
    case 'addCorr': { const n = (val('novoCorr') || '').trim().replace(/\s+/g, ' '); if (!n) break; await mut('Cadastrando…', () => { if (!S.corr.some(c => c.nome === n)) { S.corr.push({ nome: n, nome_padrao: n, tipo: val('novoTipo'), exige: false }); S.corr.sort((a, b) => a.nome.localeCompare(b.nome)); } }, ['corr']); break; }
    case 'addDepara': { const o = (val('dpO') || '').trim(); if (!o) break; await mut('Adicionando…', () => { const x = S.depara.find(d => d.nome_origem === o); if (x) x.nome_padrao = val('dpP'); else S.depara.push({ nome_origem: o, nome_padrao: val('dpP') }); }, ['depara']); break; }
    case 'grupo': S.grupo = v; S.verKey = null; render(); break;
    case 'ver': S.verKey = v; render(); break;
    case 'fechaVer': S.verKey = null; render(); break;
    case 'baixaUm': { const b = B(); await baixar(`comissao_${slug(S.verKey)}_${S.comp.slice(0, 7)}.html`, docHtml([secaoHtml(b, S.verKey)], 'Demonstrativo de comissões')); break; }
    case 'baixaGrupo': { const b = B(); const l = listaGrupo(b, S.grupo).sort((x, y) => x.benef.localeCompare(y.benef, 'pt-BR')); if (!l.length) break; await baixar(`comissoes_${S.grupo}_${S.comp.slice(0, 7)}.html`, docHtml(l.map(x => secaoHtml(b, x.benef)), 'Demonstrativos de comissões')); break; }
    case 'baixaCsv': { const b = B(); const l = listaGrupo(b, S.grupo); const h = ['Beneficiario', 'Vendas', 'VV Original', 'Comissao', 'No ato', 'A pagar agora', 'Pendente', 'Saldo regularizado', 'Premiacao', 'Total a pagar']; const csv = [h.join(';')].concat(l.map(x => [x.benef, x.n, x.vv, x.com, x.ato, x.agora, x.pend, x.pendReg, x.prem, x.total].map(csvCell).join(';'))).join('\r\n'); await baixar(`resumo_${S.grupo}_${S.comp.slice(0, 7)}.csv`, '﻿' + csv); break; }
    case 'baixaBackup': case 'baixaBackupFechar': await baixar(`backup_comissoes_${new Date().toISOString().slice(0, 10)}.json`, backupJson()); break;
    case 'baixaBaseCsv': { const h = ['Competencia', 'PV', 'Empreendimento', 'Tipologia', 'Cliente', 'Corretor', 'Imobiliaria', 'Beneficiario', 'Tipo', 'Registro', 'VV Original', 'Comissao', 'No ato', 'A pagar agora', 'Pendente', 'Premiacao', 'Situacao']; const csv = [h.join(';')].concat(S.vendas.map(v => { const c = ENG.calc(v); return [compLabel(v.comp), v.pv, v.emp, v.tip || '', v.cliente, v.corretor, v.imobiliaria || '', c.benef, c.tipo, c.reg, v.j, c.com, c.ato, c.agora, c.pend, c.prem, v.sit].map(csvCell).join(';'); })).join('\r\n'); await baixar('base_comissoes.csv', '﻿' + csv); break; }
    case 'fecharPre': fecharPre(); render(); break;
    case 'fecharOk': await fecharOk(); break;
    case 'reabrir': reabrir(); render(); break;
    case 'reabrirOk': await reabrirOk(); break;
  }
});

/* ---------- inicio ---------- */
/* ---------- carga inicial a partir de arquivo (so quando a base esta vazia) ---------- */
async function restaurar() {
  const f = (document.getElementById('cargaFile') || {}).files && document.getElementById('cargaFile').files[0];
  if (!f) { S.flash = { t: 'err', m: 'Escolha o arquivo carga_inicial_comissoes.json.' }; render(); return; }
  await guard('Importando histórico…', async () => {
    const chk = await db.doc('cfg/main').get(); if (chk.exists) throw new Error('A base já tem dados. Recarregue a página.');
    let j; try { j = JSON.parse(await f.text()); } catch (e) { throw new Error('Arquivo inválido.'); }
    const docs = j && j.docs; if (!docs || !docs['cfg/main']) throw new Error('Este arquivo não é a carga inicial de comissões.');
    const paths = Object.keys(docs).filter(p => p !== 'cfg/main');
    for (const p of paths) await dset(p, docs[p]);
    await dset('cfg/main', docs['cfg/main']);
    await loadAll(); rebuild();
    S.flash = { t: 'ok', m: `Histórico importado: ${S.vendas.length} vendas e ${Object.keys(S.fech).length} meses fechados arquivados.` };
    render();
  });
}

function startApp(supa) {
  window.__supa = supa;
  const rowErr = e => { const x = new Error(e.message); x.code = e.code; x.supa = true; return x; };
  db = {
    doc: path => ({
      async get() { const r = await supa.from('comissoes_docs').select('data').eq('path', path).maybeSingle(); if (r.error) throw rowErr(r.error); return { exists: !!r.data, data: () => r.data && r.data.data }; },
      async set(data) { const r = await supa.from('comissoes_docs').upsert({ path, data, updated_at: new Date().toISOString() }); if (r.error) throw rowErr(r.error); },
      async delete() { const r = await supa.from('comissoes_docs').delete().eq('path', path); if (r.error) throw rowErr(r.error); }
    }),
    collection: c => ({
      async get() {
        const docs = []; let off = 0;
        for (; ;) { const r = await supa.from('comissoes_docs').select('path,data').like('path', c + '/%').order('path').range(off, off + 199); if (r.error) throw rowErr(r.error); r.data.forEach(x => { if (x.path.split('/').length === 2) docs.push({ id: x.path.split('/')[1], data: () => x.data }); }); if (r.data.length < 200) break; off += 200; }
        return { docs };
      }
    })
  };
  (async () => {
    try {
      render();
      S.owner = true; S.can = true;
      const t = setTimeout(() => { if (!S.loaded) { S.loadErr = 'Os dados não responderam. Verifique a conexão e recarregue.'; render(); } }, 20000);
      const has = await loadAll(); clearTimeout(t);
      if (has) rebuild();
      S.loaded = true; S.loadErr = null; render();
    } catch (e) { S.loadErr = errMsg(e); render(); }
  })();
}
